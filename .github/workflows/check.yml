# Every push and pull request: is the site still valid and within its own rules?
# Pull requests from forks run with a read-only token and no secrets (pull_request,
# never pull_request_target). The actions are pinned to a commit; Dependabot bumps them.
name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # Not ubuntu-latest: that moved to 26.04 and broke other repos' CI this week.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: REUSE
        uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0

      - name: HTML nesting
        run: |
          for f in site/index.html site/404.html site/over/index.html site/museum/index.html site/php/index.html site/en/index.html site/uk/index.html; do
            python3 -I tools/check-html.py "$f"
          done

      - name: Feed and sitemap are XML, the JSON-LD is JSON
        run: |
          python3 -I - <<'PY'
          import json, re, xml.etree.ElementTree as ET
          for f in ("site/feed.xml", "site/sitemap.xml"):
              ET.parse(f)
          for f in ("site/index.html", "site/over/index.html", "site/museum/index.html", "site/php/index.html", "site/en/index.html", "site/uk/index.html"):
              for ld in re.findall(r'<script type="application/ld\+json">(.*?)</script>', open(f, encoding="utf-8").read(), re.S):
                  json.loads(ld)
          print("ok")
          PY

      - name: No inline script or style (the CSP forbids them)
        run: |
          if grep -n -E '<script>|<script[^>]*>[^<]|<style|style="| on[a-z]+="' site/*.html site/*/index.html | grep -v 'application/ld+json'; then
            echo "inline script or style found"; exit 1
          fi

      - name: "Every #anchor on the front page exists"
        run: |
          python3 -I - <<'PY'
          import re, sys
          s = open("site/index.html", encoding="utf-8").read()
          ids = set(re.findall(r'\sid="([^"]+)"', s))
          missing = sorted({a for a in re.findall(r'href="#([^"]+)"', s)} - ids)
          print("missing:", missing) if missing else print("ok")
          sys.exit(1 if missing else 0)
          PY

      - name: The clock is valid JavaScript
        run: node --check site/klok.js
