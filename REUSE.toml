version = 1
SPDX-PackageName = "crisus.nl"
SPDX-PackageSupplier = "Anne Jan Brouwer"
SPDX-PackageDownloadLocation = "https://crisus.nl/"

# Code and configuration: MIT.
[[annotations]]
path = [
    "tools/**",
    ".github/**",
    "skills/**",
    "site/**.css",
    "site/**.js",
    "site/.htaccess",
    "site/robots.txt",
    "site/sitemap.xml",
    ".gitignore",
    "REUSE.toml",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Anne Jan Brouwer"
SPDX-License-Identifier = "MIT"

# Pages, texts, the feed, the icon and the share image: CC-BY-4.0.
# Short quotes from news sources and advisories are cited with a link to the source.
[[annotations]]
path = [
    "site/**.html",
    "site/feed.xml",
    "site/favicon.svg",
    "site/og.png",
    "site/museum/503/*.jpg",
    "README.md",
    "CONTRIBUTING.md",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Anne Jan Brouwer"
SPDX-License-Identifier = "CC-BY-4.0"

# The museum's old exhibits (2019-2020): third-party images, shown as a historical record.
[[annotations]]
path = ["site/museum/oud/**"]
precedence = "override"
SPDX-FileCopyrightText = "Their respective owners"
SPDX-License-Identifier = "LicenseRef-ThirdPartyArchive"
